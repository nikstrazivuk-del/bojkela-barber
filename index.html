<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bojkela Barber</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c0c0c;color:#eee;font-family:Inter,Arial,sans-serif}button,input{font:inherit}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.brand{color:#c9a66b;letter-spacing:.14em;font-size:12px;font-weight:800}.hero{padding:42px 0 24px}.hero:after{content:"";display:block;width:72px;height:2px;background:#c9a66b;margin-top:24px;opacity:.75}.hero h1{font-size:clamp(36px,6vw,68px);margin:10px 0}.muted{color:#888}.panel{background:#141414;border:1px solid #292929;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0005}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button,.btn{border:1px solid #343434;background:#1a1a1a;color:#ddd;border-radius:11px;padding:12px 15px;cursor:pointer}.tabs button.active,.btn.gold{background:#c9a66b;color:#111;border-color:#c9a66b}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field input{background:#0e0e0e;color:#eee;border:1px solid #303030;border-radius:10px;padding:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.msg{padding:11px;border-radius:10px;margin:10px 0;font-size:13px}.err{background:#261818;color:#e6a1a1}.ok{background:#182319;color:#b8d8bd}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.logout{background:none;border:0;color:#888;cursor:pointer}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{padding:20px;position:relative;overflow:hidden;transition:.18s ease;border:1px solid #303030;border-radius:16px;background:#191919;cursor:pointer}.service:hover{transform:translateY(-2px);border-color:#5d4b31}.service.selected{border-color:#c9a66b;background:linear-gradient(145deg,#262015,#181510);box-shadow:0 12px 30px #0006}.service.selected:after{content:"✓";position:absolute;right:14px;top:12px;color:#c9a66b;font-weight:900}.service h3{margin:0 0 7px}.price{color:#c9a66b}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:18px 0}.day{min-height:125px;transition:.18s ease;text-align:left;border:1px solid #2b2b2b;border-radius:16px;background:linear-gradient(145deg,#202020,#151515);color:#ddd;padding:13px;cursor:pointer}.day:hover{transform:translateY(-2px);border-color:#6d593b}.day.today{border-color:#76613f}.day.selected{background:linear-gradient(145deg,#2b2419,#1b1813);border-color:#c9a66b;box-shadow:0 0 0 1px #c9a66b33}.day .dow{font-size:10px;color:#8d8d8d;text-transform:uppercase}.day .num{font-size:32px;font-weight:800;margin-top:12px}.day .mon{font-size:10px;color:#777}.day .choose{display:inline-block;margin-top:12px;font-size:9px;color:#c9a66b;border:1px solid #c9a66b33;padding:4px 7px;border-radius:20px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{padding:15px;transition:.16s ease;border:1px solid #343434;background:#1a1a1a;color:#ddd;border-radius:12px;cursor:pointer}.slot:hover{border-color:#8d754c;background:#242017}.slot.busy{opacity:.45;cursor:not-allowed;background:#111}.slot.selected{border-color:#c9a66b;background:#c9a66b;color:#111}.slot:not(.busy) .state{color:#c9a66b}.state{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;color:#9f8a68}.busy .state{color:#666}.summary{margin:15px 0;padding:14px;border:1px solid #302a20;border-radius:13px;background:#191713}.history-item{display:grid;grid-template-columns:1fr auto auto;gap:15px;align-items:center;padding:16px;border:1px solid #292929;border-radius:14px;background:#191919;margin:9px 0}.history-item small{display:block;color:#777;margin-top:5px}.status{font-size:10px;letter-spacing:.08em;color:#c9a66b}.cancel{border:1px solid #4b3d2b;background:#211d17;color:#c9a66b;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:10px}.cancel:disabled{color:#666;border-color:#292929;background:#171717;cursor:not-allowed}.urgent{margin-top:13px;padding:13px;border:1px solid #30291f;border-radius:12px;color:#888;font-size:11px}.urgent a{color:#c9a66b}.booking-hint{padding:22px;border:1px dashed #3b3428;border-radius:16px;background:linear-gradient(145deg,#171512,#121212);color:#777;text-align:center;margin-top:18px}.booking-hint strong{display:block;color:#c9a66b;margin-bottom:5px}.locked{padding:18px;border:1px solid #30291f;background:#191713;border-radius:13px;color:#999}.admin-shell{min-height:70vh}.admin-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;margin-bottom:16px;border:1px solid #5a4728;border-radius:20px;background:linear-gradient(135deg,#1d1811,#111);box-shadow:0 18px 50px #0008}.admin-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c9a66b;font-weight:800}.admin-title{font-size:30px;font-weight:900;margin:5px 0}.admin-sub{color:#888;font-size:13px}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.admin-stats>div{padding:17px;border:1px solid #292929;border-radius:16px;background:#181818}.admin-stats span{display:block;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.admin-stats strong{display:block;font-size:28px;margin-top:5px;color:#c9a66b}.admin-table-wrap{overflow:auto;border:1px solid #292929;border-radius:16px}.admin-table{width:100%;border-collapse:collapse;min-width:820px}.admin-table th{padding:13px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;background:#101010;border-bottom:1px solid #292929}.admin-table td{padding:14px 13px;border-bottom:1px solid #242424;color:#ddd;font-size:13px}.admin-table tr:last-child td{border-bottom:0}.admin-table tr:hover td{background:#191713}.admin-status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;letter-spacing:.08em;font-weight:800}.admin-status.active{background:#20301f;color:#a9d3a6}.admin-status.cancelled{background:#2b1d1d;color:#d39c9c}.admin-cancel{border:1px solid #493a2a;background:#201b15;color:#c9a66b;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:11px}.empty-admin{padding:35px;text-align:center;color:#777}.admin-note{margin-top:13px;color:#666;font-size:11px}.admin-logout{border:1px solid #333;background:#151515;color:#aaa;border-radius:10px;padding:10px 13px;cursor:pointer}@media(max-width:800px){.admin-stats{grid-template-columns:1fr}.admin-banner{align-items:flex-start;flex-direction:column}}.hidden{display:none!important}
@media(max-width:800px){.calendar{grid-template-columns:repeat(2,1fr)}.service-grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}.history-item{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="brand">BOJKELA BARBER</div><h1>Rezerviši svoje šišanje.</h1><p class="muted">Jednostavno. Brzo. Bez poziva.</p></div>
<div id="app"></div>
</div>
<script>
const API="/api";
// Admin se nikada ne otvara automatski iz stare sesije; korisnik se automatski prijavljuje samo ako je ranije čekirao „Zapamti me“.
sessionStorage.removeItem("bojkelaToken");
let token=localStorage.getItem("bojkelaToken")||""; let user=null, service="", selectedDate="", selectedTime="";
const services=["Obično šišanje","Fejd","French crop"], times=Array.from({length:15},(_,i)=>{let h=10+Math.floor(i/2),m=i%2?"30":"00";return `${String(h).padStart(2,"0")}:${m}`});
function api(url,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json"};if(token)opt.headers.Authorization="Bearer "+token;return fetch(API+url,opt).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Greška");return d})}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function loginUI(mode="login"){document.getElementById("app").innerHTML=`<div class="panel"><div class="tabs"><button id="lt" class="${mode==="login"?"active":""}">Prijava</button><button id="rt" class="${mode==="register"?"active":""}">Registracija</button></div><div id="form"></div></div>`;document.getElementById("lt").onclick=()=>loginUI("login");document.getElementById("rt").onclick=()=>loginUI("register");renderForm(mode)}
function renderForm(mode){document.getElementById("form").innerHTML=mode==="login"?`<h2>Dobro došli</h2><p class="muted">Ulogujte se da zakažete termin.</p><div class="field"><label>Korisničko ime</label><input id="u" autocomplete="off"></div><div class="field"><label>Lozinka</label><input id="p" type="password" autocomplete="new-password"></div><label class="muted"><input id="remember" type="checkbox"> Zapamti me</label><div id="msg"></div><button class="btn gold" id="go">Uloguj se</button>`:`<h2>Novi nalog</h2><div class="field"><label>Korisničko ime</label><input id="u" autocomplete="off"></div><div class="field"><label>Lozinka</label><input id="p" type="password" autocomplete="new-password"></div><div class="field"><label>Ponovi lozinku</label><input id="p2" type="password" autocomplete="new-password"></div><div id="msg"></div><button class="btn gold" id="go">Napravi nalog</button>`;
document.getElementById("go").onclick=async()=>{const u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;try{if(mode==="register"){if(p!==document.getElementById("p2").value)throw Error("Lozinke se ne podudaraju.");await api("/register",{method:"POST",body:JSON.stringify({username:u,password:p})});showMsg("Nalog je uspešno napravljen. Sada se možete prijaviti.","ok");setTimeout(()=>loginUI("login"),700)}else{let d=await api("/login",{method:"POST",body:JSON.stringify({username:u,password:p})});token=d.token;localStorage.removeItem("bojkelaToken");sessionStorage.removeItem("bojkelaToken");if(d.role==="admin"){localStorage.removeItem("bojkelaToken");sessionStorage.removeItem("bojkelaToken");user={username:d.username,role:"admin"};await adminHome();return}if(document.getElementById("remember").checked)localStorage.setItem("bojkelaToken",token);else sessionStorage.setItem("bojkelaToken",token);await boot()} }catch(e){showMsg(e.message,"err")}}}
function clearAuth(){localStorage.removeItem("bojkelaToken");sessionStorage.removeItem("bojkelaToken");token=null;user=null}
function showMsg(t,c){document.getElementById("msg").innerHTML=`<div class="msg ${c}">${esc(t)}</div>`}

async function adminHome(){
  app.innerHTML=`<div class="admin-shell">
    <div class="admin-banner">
      <div><div class="admin-kicker">BOJKELA BARBER · VLASNIK</div><div class="admin-title">Admin panel</div><div class="admin-sub">Ovo je privatni pregled svih zakazivanja. Podaci nisu prikazani na korisničkoj stranici.</div></div>
      <button class="admin-logout" id="adminOut">Odjavi se</button>
    </div>
    <div class="panel">
      <div class="row" style="margin-bottom:18px"><div><h2 style="margin:0">Zakazivanja</h2><p class="muted" style="margin:6px 0 0">Ko je zakazao, kada, koju uslugu i status termina.</p></div><button class="btn gold" id="exportBtn">↓ Excel · ovaj mesec</button></div>
      <div id="adminTable">Učitavanje...</div>
    </div>
  </div>`;
  document.getElementById("adminOut").onclick=async()=>{try{await api("/logout",{method:"POST"})}catch{}clearAuth();loginUI()};
  document.getElementById("exportBtn").onclick=async()=>{
    try{
      const r=await fetch(API+"/admin/export-month",{headers:{Authorization:"Bearer "+token}});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||"Excel izvoz nije uspeo.")}
      const blob=await r.blob(); const url=URL.createObjectURL(blob); const a=document.createElement("a");
      const now=new Date(); a.href=url; a.download=`Bojkela_Barber_Zakazivanja_${now.getFullYear()}_${String(now.getMonth()+1).padStart(2,"0")}.xlsx`;
      document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    }catch(e){alert(e.message)}
  };
  await loadAdmin();
}
async function loadAdmin(){
  try{
    const rows=await api("/admin/appointments");
    const active=rows.filter(x=>x.status==="active").length;
    const cancelled=rows.filter(x=>x.status==="cancelled").length;
    const now=new Date(), month=String(now.getMonth()+1).padStart(2,"0"), prefix=`${now.getFullYear()}-${month}-`;
    const current=rows.filter(x=>x.date.startsWith(prefix));
    document.getElementById("adminTable").innerHTML=`
      <div class="admin-stats">
        <div><span>Ukupno zakazivanja</span><strong>${rows.length}</strong></div>
        <div><span>Aktivni termini</span><strong>${active}</strong></div>
        <div><span>Ovaj mesec</span><strong>${current.length}</strong></div>
      </div>
      ${rows.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Datum</th><th>Vreme</th><th>Korisnik</th><th>Usluga</th><th>Barber</th><th>Status</th><th>Akcija</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><strong>${esc(x.time)}</strong></td><td>${esc(x.username)}</td><td>${esc(x.service)}</td><td>${esc(x.barber)}</td><td><span class="admin-status ${x.status}">${x.status==="active"?"ZAKAZANO":"OTKAZANO"}</span></td><td>${x.status==="active"?`<button class="admin-cancel" data-id="${esc(x.id)}">Otkaži</button>`:"—"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty-admin">Nema još zakazivanja.</div>`}
      <div class="admin-note">Табела је приватна и доступна само налогу vlasnika. Један датум + време може имати само један активан термин.</div>`;
    document.querySelectorAll(".admin-cancel").forEach(b=>b.onclick=async()=>{if(!confirm("Otkaži овај термин?"))return;try{await api("/admin/appointments/"+b.dataset.id+"/cancel",{method:"POST"});await loadAdmin()}catch(e){alert(e.message)}});
  }catch(e){document.getElementById("adminTable").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}

async function boot(){
  try{
    user=await api("/me");
    if(user.role==="admin"){
      // Admin never opens automatically when the public page is loaded.
      clearAuth();
      loginUI();
      return;
    }
    bookingUI();
  }catch(e){
    clearAuth();
    loginUI();
  }
}
async function initialLoad(){
  // Only a normal user's "Zapamti me" token may restore a session.
  // Admin sessions are never restored automatically on page open.
  const remembered=localStorage.getItem("bojkelaToken");
  if(!remembered){ clearAuth(); loginUI(); return; }
  token=remembered;
  try{
    user=await api("/me");
    if(user.role==="admin"){
      clearAuth();
      loginUI();
      return;
    }
    bookingUI();
  }catch(e){
    clearAuth();
    loginUI();
  }
}
function bookingUI(){
  document.getElementById("app").innerHTML=`<div class="top"><div><strong>Zdravo, ${esc(user.username)}</strong><div class="muted">Barber: Đole</div></div><button class="logout" id="logout">Odjavi se</button></div><div class="panel"><h2>1. Izaberite vrstu šišanja</h2><p class="muted">Prvo izaberite uslugu, pa ćemo vam prikazati dostupne dane i termine.</p><div class="service-grid">${services.map(x=>`<div class="service" data-s="${esc(x)}"><h3>${esc(x)}</h3><div class="price">1.200 RSD</div><div class="muted" style="font-size:11px;margin-top:8px">Kliknite za izbor</div></div>`).join("")}</div><div id="bookingStep2"><div class="booking-hint"><strong>2. Dani za zakazivanje</strong>Izaberite vrstu šišanja da biste videli narednih 14 dana.</div></div><div id="history"></div></div>`;
  document.querySelectorAll(".service").forEach(x=>x.onclick=()=>{
    service=x.dataset.s; selectedDate=""; selectedTime="";
    document.querySelectorAll(".service").forEach(y=>y.classList.remove("selected")); x.classList.add("selected");
    renderBookingDates();
  });
  loadHistory();
  document.getElementById("logout").onclick=async()=>{try{await api("/logout",{method:"POST"})}catch{}clearAuth();loginUI()};
}
function fmt(d){return d.toISOString().slice(0,10)}
function renderBookingDates(){
  document.getElementById("bookingStep2").innerHTML=`<h2>2. Izaberite dan</h2><p class="muted">Sada su prikazani samo narednih 14 dana.</p><div class="calendar" id="calendar"></div><div id="dayArea"></div>`;
  buildCalendar();
}
function buildCalendar(){const c=document.getElementById("calendar"),now=new Date();c.innerHTML="";for(let i=0;i<14;i++){let d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()+i);let el=document.createElement("button");el.className="day"+(i===0?" today":"");el.dataset.date=fmt(d);el.innerHTML=`<span class="dow">${d.toLocaleDateString("sr-RS",{weekday:"long"})}</span><div class="num">${d.getDate()}</div><span class="mon">${d.toLocaleDateString("sr-RS",{month:"long"})}</span><span class="choose">Izaberi dan +</span>`;el.onclick=()=>selectDay(el,d);c.appendChild(el)}}
async function selectDay(el,d){
  document.querySelectorAll(".day").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  selectedDate=fmt(d); selectedTime="";
  document.getElementById("dayArea").innerHTML=`<div class="summary"><strong>${d.toLocaleDateString("sr-RS",{weekday:"long",day:"numeric",month:"long"})}</strong><div class="muted">Izaberite <strong>jedan</strong> slobodan termin za ${esc(service)}.</div></div><div class="slots" id="slots">Učitavanje...</div><div id="selectionSummary"></div>`;
  let data=await api("/slots?date="+selectedDate);
  renderSlots(data.booked||[]);
}
function renderSlots(booked){
  const el=document.getElementById("slots");
  if(!el)return;
  el.innerHTML=times.map(t=>{let busy=booked.includes(t);return `<button type="button" class="slot ${busy?"busy":""}" ${busy?"disabled":""} data-time="${t}"><strong>${t}</strong><span class="state">${busy?"ZAUZETO":"SLOBODNO"}</span></button>`}).join("");
  document.querySelectorAll(".slot:not(.busy)").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");
    selectedTime=b.dataset.time;
    document.getElementById("selectionSummary").innerHTML=`<div class="summary"><div><strong>${esc(service)}</strong> · ${selectedDate} · ${selectedTime}</div><button type="button" class="btn gold" style="margin-top:10px" id="bookBtn">Zakaži termin</button></div>`;
    document.getElementById("bookBtn").onclick=book;
  });
}
async function book(){
  if(!service||!selectedDate||!selectedTime)return;
  const btn=document.getElementById("bookBtn");
  if(btn){btn.disabled=true;btn.textContent="Zakazivanje...";}
  try{
    await api("/appointments",{method:"POST",body:JSON.stringify({service,date:selectedDate,time:selectedTime})});
    alert("Termin je uspešno zakazan.");
    await loadHistory();
    const chosenDate=document.querySelector(`.day[data-date="${selectedDate}"]`);
    if(chosenDate) await selectDay(chosenDate,new Date(selectedDate+"T00:00:00"));
  }catch(e){
    alert(e.message);
    if(btn){btn.disabled=false;btn.textContent="Zakaži termin";}
    // Refresh availability in case somebody else just took the slot.
    if(selectedDate){
      const data=await api("/slots?date="+selectedDate).catch(()=>({booked:[]}));
      renderSlots(data.booked||[]);
    }
  }
}
async function loadHistory(){let h=await api("/appointments");let active=h.find(x=>x.status==="active");document.getElementById("history").innerHTML=`<h2>Moja šišanja</h2>${h.length?h.map(x=>{let can=x.status==="active"&&hours(x)>=12;return `<div class="history-item"><div><strong>${esc(x.service)}</strong><small>Đole · 1.200 RSD</small></div><div><strong>${x.date}</strong><small>${x.time}</small></div><div><span class="status">${x.status==="active"?"ZAKAZANO":"OTKAZANO"}</span>${x.status==="active"?(can?`<button class="cancel" data-id="${x.id}">Otkaži termin</button>`:`<button class="cancel" disabled>Zaključano &lt; 12h</button>`):""}</div></div>`}).join(""):`<p class="muted">Još uvek nemate zakazanih šišanja.</p>`}<div class="urgent">Hitni slučajevi: <a href="tel:067676767">067 67 67 67</a>. Otkazivanje je moguće najkasnije 12 sati pre termina.</div>`;document.querySelectorAll(".cancel:not(:disabled)").forEach(b=>b.onclick=async()=>{if(!confirm("Da li ste sigurni da želite da otkažete termin?"))return;try{await api("/appointments/"+b.dataset.id+"/cancel",{method:"POST"});alert("Termin je uspešno otkazan.");await loadHistory();if(selectedDate)selectDay(document.querySelector(`.day[data-date="${selectedDate}"]`),new Date(selectedDate+"T00:00:00"))}catch(e){alert(e.message)}})}
initialLoad();
</script></body></html>
